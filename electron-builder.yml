appId: io.github.cynicalk.glowtide
productName: Glowtide
copyright: Copyright © 2026 Glowtide
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!scripts/*'
  - '!{THIRD_PARTY_NOTICES.md,electron-builder.yml}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - resources/**
win:
  executableName: Glowtide
  target: nsis
nsis:
  artifactName: Glowtide-${version}-setup.${ext}
  shortcutName: Glowtide
  uninstallDisplayName: Glowtide
  createDesktopShortcut: always
  oneClick: true
npmRebuild: false
# Electron's build-time switches: the packaged app can't be turned into a plain Node.js
# runtime, can't be steered through NODE_OPTIONS or --inspect, loads its code only from
# app.asar, and refuses to start if app.asar has been changed after the build.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
