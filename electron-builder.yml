appId: io.github.cynicalk.glowtide
productName: Glowtide
copyright: Copyright © 2026 Glowtide
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!scripts/*'
  - '!dist/**'
  - '!{THIRD_PARTY_NOTICES.md,electron-builder.yml}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # the repo's media, docs and GitHub files are not part of the app
  - '!{media,docs,.github}/**'
  - '!{CONTRIBUTING.md,.gitattributes}'
extraResources:
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - resources/**
win:
  executableName: Glowtide
  target: nsis
nsis:
  # The install entry the app has always had (from before it was renamed): the installer
  # finds the earlier install by it and replaces it, rather than installing a second copy.
  guid: b1d96d64-9d86-5e79-89dc-9bc029dbb81e
  artifactName: Glowtide-${version}-setup.${ext}
  shortcutName: Glowtide
  uninstallDisplayName: Glowtide
  createDesktopShortcut: always
  oneClick: true
npmRebuild: false
# Electron's build-time switches: the packaged app can't be turned into a plain Node.js
# runtime, can't be steered through NODE_OPTIONS or --inspect, loads its code only from
# app.asar, and refuses to start if app.asar has been changed after the build.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
# Where installed copies look for updates (src/main/updater.js). The build writes this into
# app-update.yml; each release must carry latest.yml next to the installer.
publish:
  provider: github
  owner: cynicalk
  repo: glowtide-releases
  releaseType: release
